# Bass OS live USB: "Repair an existing installation" menu.
#
# Installed systems boot through <their partition>/boot/grub/android.cfg. When that
# file is damaged the installed GRUB has no kernel command line. These entries start
# an installed system without reading it, or boot this USB into the bass-repair tool.
# Nothing in this file writes to any disk.
#
# Set and exported by grub.cfg before bass_repair_menu is called:
#   bass_usb        device of this USB ($root)
#   bass_safe_args  default kernel command line of this release
#   bass_repair_tool  set when install.sfs carries /usr/bin/bass-repair
#   KERNEL KERNEL_ARGS INITRD iso   live boot, used by the repair tool entry

insmod part_gpt
insmod part_msdos
insmod regexp
insmod probe
insmod ext2
insmod ntfs
insmod exfat
insmod fat
insmod btrfs
insmod f2fs

# A partition is a Bass install only with android.cfg plus at least one complete slot
# (kernel, initrd and system image). Windows and other Linux partitions never match.
function bass_repair_add_install {
	set bdev="$1"
	set buuid=""
	set bslots=""
	if [ "$bdev" = "$bass_usb" ]; then
		return
	fi
	if [ ! -f "($bdev)/boot/grub/android.cfg" ]; then
		return
	fi
	for bslot in _a _b; do
		if [ -f "($bdev)/kernel$bslot" -a -f "($bdev)/initrd$bslot.img" -a -f "($bdev)/system$bslot.img" ]; then
			set bslots="$bslots $bslot"
		fi
	done
	if [ -z "$bslots" ]; then
		return
	fi
	probe --set=buuid --fs-uuid "$bdev"
	if [ -z "$buuid" ]; then
		return
	fi
	set blabel=""
	probe --set=blabel --label "$bdev"
	if [ -z "$blabel" ]; then
		set blabel="$buuid"
	fi
	if [ -n "$bass_repair_debug" ]; then
		echo "BASS_REPAIR_FOUND $bdev $buuid$bslots"
		echo "BASS_REPAIR_LABEL $bdev $blabel"
	fi

	for bslot in $bslots; do
		if [ "$bslot" = "_a" ]; then
			set bslot_name=A
		else
			set bslot_name=B
		fi
		menuentry --class blissos "Bass OS on $bdev ($blabel): start with default settings (slot $bslot_name)" "$bdev" "$buuid" "$bslot" "$bass_safe_args" {
			linux "($2)/kernel$4" $5 androidboot.mode=normal ROOT=UUID=$3 SRC= androidboot.slot_suffix=$4 androidboot.bootctrl_bootcfg=/boot/grub/android.cfg
			initrd "($2)/initrd$4.img"
		}
	done

	# android.cfg.good is written by Android (bass_init.sh) after a successful boot and
	# is only kept when it passes the same checks GRUB needs.
	if [ -f "($bdev)/boot/grub/android.cfg.good" ]; then
		menuentry --class blissos "Bass OS on $bdev ($blabel): start with last working settings" "$bdev" "$buuid" {
			set good_dev="$2"
			set good_uuid="$3"
			source "($good_dev)/boot/grub/android.cfg.good"
			linux "($good_dev)/kernel$SLOT" $CMDLINE androidboot.mode=normal ROOT=UUID=$good_uuid SRC= androidboot.slot_suffix=$SLOT androidboot.bootctrl_bootcfg=/boot/grub/android.cfg
			initrd "($good_dev)/initrd$SLOT.img"
		}
	fi
}

function bass_repair_scan {
	# (*) expands to whole disks and partitions; adding (*,*) would list installs twice.
	for bcfg in (*)/boot/grub/android.cfg; do
		if [ -f "$bcfg" ]; then
			regexp --set=1:bscan_dev '^\((.*)\)/' "$bcfg"
			bass_repair_add_install "$bscan_dev"
		fi
	done
}

function bass_repair_menu {
	submenu --class recovery --hotkey=r "Repair an existing installation" {
		bass_repair_scan
		if [ -n "$bass_repair_tool" ]; then
			menuentry --class recovery "Open the repair tool (keeps your apps and data)" {
				linux "($bass_usb)$KERNEL" $KERNEL_ARGS INSTALL=install.sfs BASS_REPAIR=1 $iso
				initrd "($bass_usb)$INITRD"
			}
		fi
	}
}
